[project]
name = "g17-extractive-qa"
version = "0.2.0"
description = "CS4248 G17: paraphrase-consistent extractive QA on SQuAD v1.1 with a learned span reranker"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "tokenizers",
    "sentencepiece",
    "tiktoken",
    "protobuf",
    "sacremoses",
    "sentence-transformers>=2.2",
    "scikit-learn",
    "scipy",
    "numpy",
    "tqdm",
    "matplotlib",
]

[project.optional-dependencies]
notebook = ["marimo>=0.13"]

[tool.setuptools]
packages = ["g17qa"]
